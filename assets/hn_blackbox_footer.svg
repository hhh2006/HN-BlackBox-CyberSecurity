<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 124" width="1200" height="124" role="img" aria-labelledby="title desc">
  <title id="title">HN BlackBox closing identity</title>
  <desc id="desc">HN BlackBox CyberSecurity footer plate: Hani Khaled Nasser Al-Nasseri, MIT license, V40.0.0.</desc>

  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="123" fill="url(#plate)" stroke="#168BFF" stroke-opacity="0.35"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#edge)"/>

  <text x="48" y="86" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="700" letter-spacing="4" fill="url(#mono)">HN</text>

  <line x1="176" y1="26" x2="176" y2="98" stroke="#168BFF" stroke-opacity="0.6"/>
  <rect x="171" y="55" width="10" height="10" transform="rotate(45 176 60)" fill="#00D9FF"/>

  <text x="206" y="54" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="5" fill="#F1F5F9">HN BLACKBOX CYBERSECURITY</text>
  <text x="206" y="84" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.5" letter-spacing="2" fill="#C7D0DC" fill-opacity="0.85">HANI KHALED NASSER AL-NASSERI · CYBERSECURITY STUDENT &amp; DEVELOPER · MIT LICENSE</text>

  <text x="1152" y="52" text-anchor="end" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13" letter-spacing="3" fill="#00D9FF">V40.0.0</text>
  <text x="1152" y="82" text-anchor="end" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12" letter-spacing="2" fill="#C7D0DC" fill-opacity="0.75">GITHUB / HHH2006</text>

  <g fill="#168BFF" fill-opacity="0.8">
    <rect x="1146" y="14" width="20" height="3"/>
    <rect x="1146" y="107" width="20" height="3"/>
  </g>

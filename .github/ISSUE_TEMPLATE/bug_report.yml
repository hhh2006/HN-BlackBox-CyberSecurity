name: Bug report
description: Report a reproducible problem in HN BlackBox
title: "[BUG] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the shortest reliable sequence.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11 / Python 3.11 / GPU model
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
